# Source registry.
#
# `credibility` feeds the deterministic half of the ranking formula and is set by tier,
# not by taste:
#   1.00  primary     first-party announcement from the organisation itself
#   0.90  research    preprint server; real but unreviewed
#   0.85  journalism  established outlet with an editorial process
#   0.70  ecosystem   practitioner blogs and tooling announcements
#
# `max_items_per_run` caps a feed's contribution to one run. Research feeds publish
# hundreds of papers a day and would otherwise drown every other source.
#
# Feeds are verified with `python scripts/verify_sources.py`. Anything that fails is set
# to `enabled: false` with a note rather than deleted, so the next reader does not
# rediscover the same dead URL.

sources:
  # --- Tier 1: primary ------------------------------------------------------
  - id: openai
    name: OpenAI
    tier: primary
    feed_url: https://openai.com/news/rss.xml
    site_url: https://openai.com/news/
    credibility: 1.0

  - id: google-deepmind
    name: Google DeepMind
    tier: primary
    feed_url: https://deepmind.google/blog/rss.xml
    site_url: https://deepmind.google/discover/blog/
    credibility: 1.0

  - id: google-ai
    name: Google AI Blog
    tier: primary
    feed_url: https://blog.google/technology/ai/rss/
    site_url: https://blog.google/technology/ai/
    credibility: 1.0

  - id: meta-ai
    name: Meta AI
    tier: primary
    feed_url: https://ai.meta.com/blog/rss/
    site_url: https://ai.meta.com/blog/
    credibility: 1.0
    enabled: false
    note: >-
      Verified 2026-08-26: /blog/rss/ and /blog/feed/ both return 404, and the
      about.fb.com AI tag feed is also gone. Meta publishes no working RSS. Re-check
      if that changes; otherwise Meta news arrives via the journalism tier.

  - id: microsoft-research
    name: Microsoft Research
    tier: primary
    feed_url: https://www.microsoft.com/en-us/research/feed/
    site_url: https://www.microsoft.com/en-us/research/
