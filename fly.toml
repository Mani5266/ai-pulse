# Fly.io deployment for the always-on bot.
#
#   fly launch --no-deploy --copy-config --name ai-pulse-bot
#   fly secrets set AI_PULSE_TELEGRAM_BOT_TOKEN=... AI_PULSE_TELEGRAM_CHAT_ID=...
#   fly deploy
#
# One shared-cpu-1x machine with 256 MB is enough: the bot holds one idle connection and
# reads a JSON file when someone asks. Check Fly's current pricing before assuming it is
# free — the terms have changed more than once, and this project's premise is zero cost.
#
# The machine must not stop when idle. A long poll is an open connection with no traffic
# on it, which is exactly what autostop is designed to reclaim, and a stopped bot answers
# nothing. There is no [http_service] block, so nothing would restart it either.
#
# Data is baked into the image, so the machine is only as current as its last deploy.
# `.github/workflows/daily.yml` redeploys after it commits the day's briefing, which is
# what keeps the two in step. Deploy by hand and the bot serves whatever was current when
# you built it.

app = "ai-pulse-bot"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  AI_PULSE_DATA_DIR = "data"
  AI_PULSE_LOG_LEVEL = "INFO"
  # Anyone who finds the bot can read the briefing. Nothing that costs.
  AI_PULSE_PUBLIC_READ_ONLY = "true"
  # No pipeline runs in here: the write would land in an ephemeral layer and there is no
  # model key in this image to run one with. See Settings.bot_allow_refresh.
  AI_PULSE_BOT_ALLOW_REFRESH = "false"

# No [http_service] block: the bot long-polls outbound and accepts no inbound traffic,
# so exposing a port would only be an attack surface.

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
