[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-pulse"
version = "0.1.0"
description = "Multi-source event intelligence pipeline for AI news"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
]

[project.scripts]
ai-pulse = "app.jobs.daily_briefing:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "S",    # bandit
    "SIM",  # simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Asserts are the point of a test, and fake credentials in fixtures are not secrets.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_explicit = false
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["feedparser.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
