name: Daily briefing

on:
  schedule:
    # 02:00 UTC is 07:30 IST. GitHub can delay a scheduled run under load, which is
    # exactly why the pipeline windows on the last briefing rather than on a fixed 24
    # hours: a late or skipped run picks up what it missed instead of losing it.
    - cron: "0 2 * * *"
    # A second attempt, six hours later, because GitHub skips scheduled runs under load
    # without saying so — the 02:00 run on 27 August never fired at all. The `decide` job
    # below turns this into a no-op on every day the first run landed, so the cost of the
    # safety net is one 20-second job.
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Never two runs at once: both would append to the same day's data and fight over the
  # commit.
  group: daily-briefing
  cancel-in-progress: false

jobs:
  # Has today already been covered? A second scheduled attempt must not rebuild a briefing
  # that worked: `write_briefing` refuses to replace a good briefing with an empty one, but
  # a five-story briefing replaced by a two-story one is a loss it cannot see. Cheaper and
  # safer to not run at all.
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v5

      - id: check
        env:
          # A hand-dispatched run always runs: somebody asked for it on purpose.
          MANUAL: ${{ github.event_name != 'schedule' }}
        run: |
          today="data/briefings/$(date -u +%Y-%m-%d).json"
          if [ "$MANUAL" = "true" ]; then
            echo "dispatched by hand; running"
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ -f "$today" ]; then
            echo "$today already exists; nothing to do"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "no briefing for today yet; running"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  brief:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        # The runtime lock, so the 02:00 run installs exactly what was last verified.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.runtime.lock
          pip install -e . --no-deps

      - name: Build the briefing
        env:
          AI_PULSE_LLM_PROVIDER: hosted
          AI_PULSE_LLM_MODEL: openai/gpt-oss-120b
          # The chain order. A tier with no secret set is skipped, so an unset key costs
          # nothing; the run continues on whichever tiers do have one.
          AI_PULSE_LLM_CHAIN: groq,openrouter
          AI_PULSE_GROQ_API_KEY: ${{ secrets.AI_PULSE_GROQ_API_KEY }}
          AI_PULSE_OPENROUTER_API_KEY: ${{ secrets.AI_PULSE_OPENROUTER_API_KEY }}
          AI_PULSE_TELEGRAM_BOT_TOKEN: ${{ secrets.AI_PULSE_TELEGRAM_BOT_TOKEN }}
          AI_PULSE_TELEGRAM_CHAT_ID: ${{ secrets.AI_PULSE_TELEGRAM_CHAT_ID }}
        run: python -m app.jobs.daily_briefing

      - name: Commit the day's data
        # The repository is the database, so the run's output has to be committed for the
        # next run to know what this one covered. Nothing is committed when nothing
        # changed, which keeps a quiet day out of the history.
        run: |
          git config user.name "ai-pulse[bot]"
          git config user.email "ai-pulse[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no new data"
          else
            git commit -m "data: briefing for $(date -u +%Y-%m-%d)"
            git push
          fi

      # The bot serves the briefings baked into its image, so a new briefing means a new
      # image. Skipped entirely when FLY_API_TOKEN is unset, which is the state of any
      # fork and of this repository until the bot is actually deployed — the scheduled
      # worker in bot.yml is the free alternative and needs none of this.
      #
      # Deliberately not `needs`-gated on the Pages deploy below: a failure to redeploy
      # the bot must not cost the day's briefing, which is already committed and served.
      - name: Redeploy the bot, if there is one
        if: ${{ env.FLY_API_TOKEN != '' }}
        continue-on-error: true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          curl -L https://fly.io/install.sh | sh
          "$HOME/.fly/bin/flyctl" deploy --remote-only --wait-timeout 300

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5

  # A run that fails silently is the failure mode this project is least able to notice,
  # since nobody is watching at 02:00 UTC. This makes it visible in the Actions tab.
  report:
    needs: brief
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Say what failed
        run: |
          echo "::error::The daily briefing failed. Check the run log above."
          exit 1
