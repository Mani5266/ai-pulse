name: Feed health

on:
  schedule:
    # Weekly, Monday 03:00 UTC. Feeds die quietly: four of the original candidates were
    # already dead when this project started, and one turned into an HTML page mid-build.
    # Nothing in the daily run fails when a feed rots — it is skipped and the briefing is
    # simply thinner — so without this the decay is invisible until coverage is gone.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.runtime.lock
          pip install -e . --no-deps

      - name: Verify every enabled feed
        # Exits non-zero if any enabled source fails, which surfaces as a failed workflow
        # and an email. Deliberately a separate workflow from the briefing: a dead feed
        # should never fail a run that still produced a good briefing.
        run: python scripts/verify_sources.py
