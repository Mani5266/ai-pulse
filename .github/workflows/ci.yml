name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        # From the lockfile, not the ranges: an unpinned tree means a build that passed an
        # hour ago can fail now because something upstream released.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        # Coverage is measured here rather than in `addopts`, so that running one test file
        # locally does not fail a whole-project floor. The floor itself lives in
        # `[tool.coverage.report]`, and `--cov` is what turns it on.
        run: pytest --cov

      - name: Audit dependencies
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.lock --strict

      - name: Evaluate
        # Structural checks only: offline, free, no key. The model layer is run
        # deliberately with --with-model, because it costs quota.
        run: python scripts/eval.py
